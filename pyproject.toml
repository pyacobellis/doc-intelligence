[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence"
version = "0.1.0"
description = "Config-driven document intelligence framework on Databricks (NSW Water Sharing Plans first)"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.40",
  "pyyaml>=6",
  "pandas>=2",
  "pyarrow>=14",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = [
  "databricks-connect>=16.1",
  "databricks-sql-connector",
  "pytest>=8",
]

[project.scripts]
doc-intel = "doc_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["doc_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real Databricks compute (needs auth; read-only and cheap)"]
