# Databricks Asset Bundle: packages the doc_intelligence wheel, a serverless pipeline job
# (parse -> chunk -> index -> extract-rules) and the Streamlit app.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev      # asks first: writes to the workspace
#   databricks bundle run doc_intel_pipeline -t dev
#   databricks bundle run doc_intel_pipeline -t dev --params config_path=configs/<type>.yaml

bundle:
  name: doc_intelligence

variables:
  config_path:
    description: Document-type config, relative to the synced bundle root
    default: configs/wsp.yaml
  warehouse_id:
    description: SQL warehouse the app queries through
    lookup:
      warehouse: "Serverless Starter Warehouse"

artifacts:
  doc_intelligence:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --wheel-dir dist

sync:
  exclude:
    - .venv
    - data
    - notebooks
    - tests
    - .pytest_cache
    - .databricks

resources:
  jobs:
    # One pipeline job serves every document type: override the config_path job parameter
    # at run time, e.g. `databricks bundle run doc_intel_pipeline --params config_path=configs/award.yaml`
    doc_intel_pipeline:
      name: "[${bundle.target}] doc-intel pipeline"
      parameters:
        - name: config_path
          default: ${var.config_path}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: parse
          environment_key: default
          python_wheel_task:
            package_name: doc_intelligence
            entry_point: doc-intel
            parameters: ["--config", "${workspace.file_path}/{{job.parameters.config_path}}", "parse"]
        - task_key: chunk
          depends_on: [{ task_key: parse }]
          environment_key: default
          python_wheel_task:
            package_name: doc_intelligence
            entry_point: doc-intel
            parameters: ["--config", "${workspace.file_path}/{{job.parameters.config_path}}", "chunk"]
        - task_key: index
          depends_on: [{ task_key: chunk }]
          environment_key: default
          python_wheel_task:
            package_name: doc_intelligence
            entry_point: doc-intel
            parameters: ["--config", "${workspace.file_path}/{{job.parameters.config_path}}", "index"]
        - task_key: extract_rules
          depends_on: [{ task_key: chunk }]
          environment_key: default
          python_wheel_task:
            package_name: doc_intelligence
            entry_point: doc-intel
            parameters: ["--config", "${workspace.file_path}/{{job.parameters.config_path}}", "extract-rules"]

    wsp_check_source:
      name: "[${bundle.target}] doc-intel check source (wsp)"
      # Records change proposals for review. Paused: Free Edition serverless compute has no
      # outbound internet, so on this workspace `check-source` runs from a laptop instead.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: Australia/Sydney
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: check_source
          environment_key: default
          python_wheel_task:
            package_name: doc_intelligence
            entry_point: doc-intel
            parameters: ["--config", "${workspace.file_path}/${var.config_path}", "check-source"]

  apps:
    wsp_app:
      name: doc-intel-wsp
      description: Q&A, rule comparison, change log and cost view over the WSP corpus
      source_code_path: .
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: wps_doc_intel
